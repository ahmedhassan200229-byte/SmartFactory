<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Smart Factory Downloader</title>
    <!-- تضمين مكتبة التصميم المتطورة Tailwind -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- مكتبة الأيقونات التكنولوجية الفخمة -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Cairo:wght@400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; transition: background-color 0.3s ease, color 0.3s ease; }
        .tech-font { font-family: 'Orbitron', 'Cairo', sans-serif; }
        
        /* أزرار وتأثيرات توهج النيون الفائقة في الوضع الداكن والنهاري */
        .dark .neon-btn-blue {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
            text-shadow: 0 0 5px rgba(59, 130, 246, 0.5);
        }
        .dark .neon-btn-emerald {
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.5);
            text-shadow: 0 0 5px rgba(16, 185, 129, 0.5);
        }
        .light .neon-btn-blue {
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
        }
        .light .neon-btn-emerald {
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 dark:bg-slate-950 dark:text-slate-100 light:bg-slate-50 light:text-slate-900 min-h-screen flex flex-col items-center p-3">

    <!-- الحاوية التكنولوجية الرأسية المصممة للهواتف الذكية -->
    <main class="w-full max-w-md bg-slate-900/90 dark:bg-slate-900/90 light:bg-white rounded-3xl border border-blue-500/30 dark:border-blue-500/30 light:border-slate-200 shadow-[0_0_30px_rgba(0,0,0,0.5)] p-5 flex flex-col gap-5 mt-2 relative overflow-hidden backdrop-blur-md">
        
        <!-- مؤثرات الإضاءة الخلفية النيون الموزعة هندسياً -->
        <div class="absolute -top-24 -left-24 w-48 h-48 bg-blue-500/10 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-purple-500/10 rounded-full blur-3xl pointer-events-none"></div>

        <!-- شريط الحالة العلوي وزر التحويل بين الوضع الليلي والنهاري -->
        <div class="flex justify-between items-center border-b border-slate-800 dark:border-slate-800 light:border-slate-100 pb-3">
            <div class="flex items-center gap-2">
                <div class="w-2.5 h-2.5 rounded-full bg-blue-500 animate-pulse shadow-[0_0_8px_#3b82f6]"></div>
                <span class="tech-font text-[10px] tracking-widest text-blue-400 font-bold">CORE CORE SYSTEM v2.0</span>
            </div>
            <!-- زر تبديل الثيم -->
            <button onclick="toggleTheme()" class="w-9 h-9 rounded-xl bg-slate-800 dark:bg-slate-800 light:bg-slate-100 flex items-center justify-center border border-slate-700 dark:border-slate-700 light:border-slate-200 text-amber-400 dark:text-amber-400 light:text-indigo-600 hover:scale-105 transition-all cursor-pointer">
                <i id="theme-icon" class="fa-solid fa-moon text-sm"></i>
            </button>
        </div>

        <!-- ترويسة التطبيق والشعار المتطور -->
        <header class="text-center flex flex-col items-center gap-1 mt-1">
            <h1 class="text-lg font-black tracking-wide bg-gradient-to-r from-blue-400 via-indigo-400 to-cyan-400 bg-clip-text text-transparent flex items-center gap-1.5">
                <i class="fa-solid fa-bolt text-blue-500 animate-bounce"></i> المحمل التكنولوجي الذكي
            </h1>
            <p class="text-[10px] text-slate-400 dark:text-slate-400 light:text-slate-500 font-semibold">تعدين ومعالجة الميديا وفحص محتويات القوائم المتقدمة</p>
        </header>

        <!-- حقل الرابط مع زر الفحص المضيء -->
        <section class="flex flex-col gap-1.5">
            <div class="flex gap-2">
                <input type="text" id="url-input" placeholder="أدخل رابط اليوتيوب أو القائمة هنا..." class="flex-1 bg-slate-950 dark:bg-slate-950 light:bg-slate-100 border border-slate-800 dark:border-slate-800 light:border-slate-300 rounded-xl px-3 py-2.5 text-xs focus:outline-none focus:border-blue-500 text-left transition-all font-semibold" dir="ltr">
                <button onclick="analyzeURL()" id="btn-analyze" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2.5 rounded-xl font-bold text-xs transition-all flex items-center gap-1 neon-btn-blue shadow-lg active:scale-95 cursor-pointer flex-shrink-0">
                    <i class="fa-solid fa-network-wired"></i>
                    <span>فحص</span>
                </button>
            </div>
        </section>

        <!-- نافذة معالجة السيرفر وشريط التحميل الحقيقي للملف المضغوط -->
        <section id="status-container" class="hidden bg-slate-950/80 dark:bg-slate-950/80 light:bg-slate-100 border border-blue-500/20 rounded-xl p-3 flex flex-col gap-2">
            <div class="flex items-center gap-2 text-[11px]">
                <i id="status-spinner" class="fa-solid fa-circle-notch animate-spin text-blue-400"></i>
                <p id="status-text" class="text-slate-300 dark:text-slate-300 light:text-slate-700 font-medium"></p>
            </div>
            <div id="progress-bar-container" class="hidden w-full bg-slate-800 dark:bg-slate-800 light:bg-slate-200 rounded-full h-1.5 overflow-hidden">
                <div id="progress-bar" class="bg-gradient-to-r from-blue-500 to-cyan-400 h-full w-0 transition-all duration-300 shadow-[0_0_10px_#3b82f6]"></div>
            </div>
        </section>

        <!-- لوحة تحكم الخيارات والتحميل الكلي بعد نجاح الفحص -->
        <section id="playlist-info" class="hidden bg-slate-950/60 dark:bg-slate-950/60 light:bg-slate-50 border border-slate-800 dark:border-slate-800 light:border-slate-200 rounded-2xl p-3.5 flex flex-col gap-3">
            <div class="flex flex-col gap-0.5 border-r-2 border-blue-500 pr-2">
                <h2 id="playlist-title" class="font-bold text-xs text-slate-200 dark:text-slate-200 light:text-slate-800 truncate"></h2>
                <p id="playlist-count" class="text-[9px] text-blue-400 font-bold tech-font"></p>
            </div>
            
            <div class="flex items-center justify-between gap-2 pt-2 border-t border-slate-800/60 dark:border-slate-800/60 light:border-slate-200">
                <div class="flex items-center gap-1.5">
                    <label class="text-[10px] font-bold text-slate-400">الجودة البصرية:</label>
                    <select id="quality-select" class="bg-slate-900 dark:bg-slate-900 light:bg-white border border-slate-700 dark:border-slate-700 light:border-slate-300 rounded-lg px-2 py-0.5 text-[11px] text-blue-400 font-bold focus:outline-none">
                        <option value="720p">720p HD</option>
                        <option value="480p" selected>480p SD</option>
                        <option value="360p">360p LQ</option>
                    </select>
                </div>
                <button onclick="downloadZip()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs px-3.5 py-2 rounded-xl transition-all flex items-center gap-1 neon-btn-emerald shadow-md cursor-pointer active:scale-95">
                    <i class="fa-solid fa-file-zipper"></i>
                    <span>تجميع وتحميل ZIP</span>
                </button>
            </div>
        </section>

        <!-- عرض فيديوهات القائمة بشكل كروت تكنولوجية عمودية متناسقة -->
        <section class="flex flex-col gap-2 overflow-y-auto max-h-[300px] pr-1" id="videos-list"></section>

    </main>

    <script>
        // كود تحويل المظهر التكنولوجي (ليلي / نهاري) بشكل متناسق
        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                html.classList.add('light');
                icon.className = "fa-solid fa-sun text-amber-500";
            } else {
                html.classList.remove('light');
                html.classList.add('dark');
                icon.className = "fa-solid fa-moon text-blue-400";
            }
        }

        let currentPlaylistData = null;

        // دالة الفحص وجلب المحتويات
        async function analyzeURL() {
            const url = document.getElementById('url-input').value.trim();
            if(!url) return;

            const btn = document.getElementById('btn-analyze');
            const statusBox = document.getElementById('status-container');
            const statusText = document.getElementById('status-text');
            const playlistBox = document.getElementById('playlist-info');
            const videosList = document.getElementById('videos-list');

            btn.disabled = true;
            statusBox.classList.remove('hidden');
            playlistBox.classList.add('hidden');
            videosList.innerHTML = '';
            statusText.innerText = "جاري الاتصال بالبوابة الإلكترونية وفك التشفير الهيكلي...";

            try {
                const response = await fetch(`/api/analyze?url=${encodeURIComponent(url)}`);
                const data = await response.json();

                if(data.error) {
                    statusText.innerText = `فشل البروتوكول: ${data.error}`;
                    btn.disabled = false;
                    return;
                }

                currentPlaylistData = data;
                document.getElementById('playlist-title').innerText = data.title;
                document.getElementById('playlist-count').innerText = `DATA BLOCK: ${data.videos.length} NODES TRACKED`;
                
                playlistBox.classList.remove('hidden');
                statusBox.classList.add('hidden');

                // بناء كروت الفيديوهات مع إصلاح وحل مشكلة جلب الصور بشكل كامل
                data.videos.forEach((video) => {
                    const card = document.createElement('div');
                    card.className = "bg-slate-950/80 dark:bg-slate-950/80 light:bg-slate-50 border border-slate-800/80 dark:border-slate-800/80 light:border-slate-200 rounded-xl p-2.5 flex gap-3 items-center shadow-sm relative";
                    
                    const thumbnailUrl = video.thumbnail || 'https://images.unsplash.com/photo-1611162617213-7d7a39e9b1d7?w=150';

                    card.innerHTML = `
                        <img src="${thumbnailUrl}" class="w-16 h-11 object-cover rounded-lg border border-slate-800 dark:border-slate-800 light:border-slate-200 flex-shrink-0">
                        <div class="flex-1 min-w-0 flex flex-col gap-0.5">
                            <h3 class="text-[11px] font-bold text-slate-300 dark:text-slate-300 light:text-slate-800 truncate text-right">${video.title}</h3>
                            <div class="flex items-center justify-between">
                                <span class="text-[9px] text-blue-400 font-bold tech-font" dir="ltr">${video.duration || '00:00'}</span>
                                <input type="checkbox" checked data-id="${video.id}" class="w-3.5 h-3.5 rounded accent-blue-500 cursor-pointer">
                            </div>
                        </div>
                    `;
                    videosList.appendChild(card);
                });

            } catch (err) {
                statusText.innerText = "فشل الاتصال بالنظام الأساسي. يرجى مراجعة نافذة الباش.";
            } finally {
                btn.disabled = false;
            }
        }

        // دالة تجميع وحقن ملفات الـ ZIP من السيرفر بشكل مستقر وآمن للملفات الكبيرة
        async function downloadZip() {
            if(!currentPlaylistData) return;
            
            const quality = document.getElementById('quality-select').value;
            const statusBox = document.getElementById('status-container');
            const statusText = document.getElementById('status-text');
            const progressBarContainer = document.getElementById('progress-bar-container');
            const progressBar = document.getElementById('progress-bar');

            statusBox.classList.remove('hidden');
            progressBarContainer.classList.remove('hidden');
            progressBar.style.width = '0%';
            statusText.innerText = "بدء تشغيل محرك السحب المركزي ومعالجة حزم الميديا الفورية...";

            const checkboxes = document.querySelectorAll('#videos-list input[type="checkbox"]:checked');
            const selectedIds = Array.from(checkboxes).map(cb => cb.getAttribute('data-id'));

            if(selectedIds.length === 0) {
                statusText.innerText = "⚠️ لم يتم تحديد أي مسارات ميديا لحقنها داخل الحزمة.";
                return;
            }

            // محاكاة ذكية للمؤشر تعكس تقدم المعالجة التدريجية في السيرفر
            let progress = 0;
            const progressInterval = setInterval(() => {
                if (progress < 95) {
                    progress += Math.random() * 6;
                    progressBar.style.width = `${Math.min(progress, 95)}%`;
                    statusText.innerText = `جاري تحميل المسارات وبناء الحزمة التكنولوجية... (${Math.floor(progress)}%)`;
                }
            }, 2500);

            try {
                const response = await fetch('/api/download-zip', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        playlist_title: currentPlaylistData.title,
                        quality: quality,
                        video_ids: selectedIds,
                        url: document.getElementById('url-input').value.trim()
                    })
                });

                clearInterval(progressInterval);

                if (response.ok) {
                    progressBar.style.width = '100%';
                    statusText.innerText = "🟢 اكتملت هندسة الحزمة بنجاح! جاري دمج وتمرير الملف لجهازك...";
                    
                    const blob = await response.blob();
                    const downloadUrl = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = downloadUrl;
                    a.download = `${currentPlaylistData.title || 'smart_media_archive'}.zip`;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                } else {
                    statusText.innerText = "❌ حدث فيضان في سعة ذاكرة خادم التجميع المؤقت.";
                }
            } catch (error) {
                clearInterval(progressInterval);
                statusText.innerText = "❌ انقطع بروتوكول نقل البيانات المادي.";
            }
        }
    </script>
</body>
</html>
