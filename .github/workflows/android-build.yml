name: Build Android App (PWA to APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Bubblewrap CLI
      run: npm install -g @bubblewrap/cli

    - name: Configure Bubblewrap Paths (Skip Prompts)
      run: |
        mkdir -p ~/.bubblewrap
        echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_SDK_ROOT\"}" > ~/.bubblewrap/config.json

    - name: Generate Complete TWA Project Configuration
      # توليد ملف الإعدادات الشامل والجاهز للمشروع لمنع أي أسئلة نهائياً
      run: |
        echo '{
          "packageId": "com.smartfactory.app",
          "host": "ahmedhassan200229-byte.github.io",
          "name": "Smart Factory",
          "launcherName": "Smart Factory",
          "startUrl": "/SmartFactory/",
          "iconUrl": "https://ahmedhassan200229-byte.github.io/SmartFactory/icon-512.png",
          "themeColor": "#0a0e12",
          "navigationColor": "#0a0e12",
          "navigationColorDark": "#0a0e12",
          "navigationDividerColor": "#0a0e12",
          "navigationDividerColorDark": "#0a0e12",
          "backgroundColor": "#0a0e12",
          "enableNotifications": false,
          "display": "standalone",
          "orientation": "portrait",
          "shortcuts": [],
          "features": {},
          "alphaDependencies": false,
          "appVersionCode": 1,
          "appVersion": "1.0.0",
          "signingKey": {
            "path": "./android.keystore",
            "alias": "android"
          },
          "fallbackType": "customtabs",
          "generatorApp": "bubblewrap-cli",
          "webManifestUrl": "https://ahmedhassan200229-byte.github.io/SmartFactory/manifest.json"
        }' > twa-manifest.json

    - name: Pre-build TWA Android Project
      # توليد ملفات الأندرويد مباشرة من التكوين دون أي حوارات تفاعلية
      run: |
        bubblewrap build --twaManifest=twa-manifest.json --skipSigning=true || true
        
    - name: Build & Sign Final APK
      # بناء وتوقيع حزمة التطبيق النهائية
      run: |
        bubblewrap build --skipSigning=false --keyStorePassword="password" --keyPassword="password"

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Smart-Factory-Android-App
        path: |
          *.apk
          *.aab
