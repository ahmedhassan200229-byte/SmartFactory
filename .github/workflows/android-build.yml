name: Build Android App (PWA to APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Bubblewrap CLI
      run: npm install -g @bubblewrap/cli

    - name: Configure Bubblewrap Paths (Skip Prompts)
      # هاتف الخطوة يقوم بإنشاء ملف الإعدادات لتخطي الأسئلة التفاعلية
      run: |
        mkdir -p ~/.bubblewrap
        echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json

    - name: Initialize Bubblewrap Project
      run: |
        bubblewrap init --manifest="https://ahmedhassan200229-byte.github.io/SmartFactory/" --meta-package="com.smartfactory.app" --fast
        
    - name: Build APK & Sign
      run: |
        bubblewrap build --skipSigning=false --keyStorePassword="password" --keyPassword="password"

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Smart-Factory-Android-App
        path: |
          *.apk
          *.aab
