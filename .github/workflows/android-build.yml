name: Build Android App (PWA to APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Bubblewrap CLI
      run: npm install -g @bubblewrap/cli

    - name: Configure Bubblewrap Paths (Skip Prompts)
      run: |
        mkdir -p ~/.bubblewrap
        echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_SDK_ROOT\"}" > ~/.bubblewrap/config.json

    - name: Generate TWA Manifest to Skip CLI Prompts
      run: |
        echo '{
          "packageId": "com.smartfactory.app",
          "host": "ahmedhassan200229-byte.github.io",
          "name": "Smart Factory",
          "launcherName": "Smart Factory",
          "startUrl": "/SmartFactory/",
          "iconUrl": "https://ahmedhassan200229-byte.github.io/SmartFactory/icon-512.png",
          "themeColor": "#0a0e12",
          "navigationColor": "#0a0e12",
          "navigationColorDark": "#0a0e12",
          "navigationDividerColor": "#0a0e12",
          "navigationDividerColorDark": "#0a0e12",
          "backgroundColor": "#0a0e12",
          "enableNotifications": false,
          "display": "standalone",
          "orientation": "portrait",
          "shortcuts": [],
          "features": {},
          "alphaDependencies": false,
          "appVersionCode": 1,
          "appVersion": "1.0.0",
          "signingKey": {
            "path": "./android.keystore",
            "alias": "android"
          },
          "fallbackType": "customtabs"
        }' > twa-manifest.json

    - name: Initialize & Build PWA directly
      # تم إدراج معامل --manifest بجانب --waves لحل المشكلة نهائياً
      run: |
        bubblewrap init --manifest="https://ahmedhassan200229-byte.github.io/SmartFactory/manifest.json" --waves=twa-manifest.json
        
    - name: Build APK & Sign
      run: |
        bubblewrap build --skipSigning=false --keyStorePassword="password" --keyPassword="password"

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Smart-Factory-Android-App
        path: |
          *.apk
          *.aab
